openapi: 3.0.3
info:
  title: Credentials API – Group 2 (Production Sprint)
  version: 1.0.0
  description: |
    Auth, verification, and admin endpoints.
    Public: /, /health, /auth/register, /auth/login, /auth/password/reset-request, GET /auth/password/reset (HTML form).
    Protected routes use Bearer (JWT).

servers:
  - url: https://credentials-api-group2-20f368b8528b.herokuapp.com/api-docs/
    description: Production
  - url: http://localhost:4000
    description: Local

tags:
  - name: Health
  - name: Auth
  - name: Verification
  - name: Admin

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1024 }
        account_id: { type: integer, example: 1024 }
        email: { type: string, format: email, example: "jakita987@gmail.com" }
        firstname: { type: string, example: "Jakita" }
        lastname: { type: string, example: "Kaur" }
        phone: { type: string, example: "12532578423" }

    AccessTokenResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Login successful" }
        data:
          type: object
          properties:
            accessToken: { type: string, example: "eyJhbGciOi..." }
            user:
              $ref: "#/components/schemas/User"

    OkEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Success" }
        data:
          type: object
          additionalProperties: true

    CarrierList:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Success" }
        data:
          type: object
          properties:
            carriers:
              type: array
              items: { type: string }
              example: ["att","tmobile","verizon","sprint","metropcs","boost","cricket","uscellular"]

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string, example: "Unauthorized" }
        details: { type: string, example: "Invalid credentials" }

  responses:
    UnauthorizedError:
      description: Unauthorized
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ForbiddenError:
      description: Forbidden
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    BadRequestError:
      description: Bad Request
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFoundError:
      description: Not Found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

paths:
  /:
    get:
      tags: [Health]
      summary: API info
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }

  /health:
    get:
      tags: [Health]
      summary: Health heartbeat
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user and receive an access token
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstname, lastname, email, username, password, phone]
              properties:
                firstname: { type: string, example: "Jakita" }
                lastname: { type: string, example: "Kaur" }
                email: { type: string, format: email, example: "jakita987@gmail.com" }
                username: { type: string, example: "jakita_{{$timestamp}}" }
                password: { type: string, example: "Jakita2005!" }
                phone: { type: string, example: "12532578423" } # E.164
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessTokenResponse" } } }
        "200":
          description: Created (some deployments return 200)
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessTokenResponse" } } }
        "400": { $ref: "#/components/responses/BadRequestError" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive an access token
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "jakita987@gmail.com" }
                password: { type: string, example: "Jakita2005!" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessTokenResponse" } } }
        "401":
          description: Bad credentials
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /auth/password/reset-request:
    post:
      tags: [Auth]
      summary: Request password reset email (link to HTML form)
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: "jakita987@gmail.com" }
      responses:
        "200":
          description: Reset email dispatched (may include dev-only info)
          content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequestError" }

  /auth/password/reset:
    get:
      tags: [Auth]
      summary: Password reset page (HTML) opened from email link
      description: |
        Returns an HTML form to set a new password. Accessed via the emailed link.
        Postman test asserts **text/html** and presence of "Reset Your Password".
      security: []   # public via signed link
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }
          description: Signed reset token included in the email link.
      responses:
        "200":
          description: Reset form HTML
          content:
            text/html:
              schema:
                type: string
                example: "<!doctype html><html><body><h1>Reset Your Password</h1>...</body></html>"
        "400": { $ref: "#/components/responses/BadRequestError" }

  /auth/verify/email/send:
    post:
      tags: [Verification]
      summary: Send email verification link
      security: [ { BearerAuth: [] } ]
      responses:
        "200":
          description: Email verification dispatched
          content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /auth/verify/carriers:
    get:
      tags: [Verification]
      summary: Get supported SMS carriers
      security: [ { BearerAuth: [] } ]
      responses:
        "200":
          description: Carrier list
          content: { application/json: { schema: { $ref: "#/components/schemas/CarrierList" } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /auth/verify/phone/send:
    post:
      tags: [Verification]
      summary: Send SMS verification code
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, carrier_id]
              properties:
                phone: { type: string, example: "12532578423" }
                carrier_id: { type: string, example: "tmobile" }
      responses:
        "200":
          description: Code sent
          content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } }
        "500":
          description: Failed to send SMS (e.g., dev or invalid number)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /auth/verify/phone/verify:
    post:
      tags: [Verification]
      summary: Verify SMS code
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "12532578423" }
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Phone verified
          content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users (admin)
      security: [ { BearerAuth: [] } ]   # use adminToken in Postman
      responses:
        "200":
          description: Users array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }

  /admin/users/stats/dashboard:
    get:
      tags: [Admin]
      summary: Dashboard stats (admin)
      security: [ { BearerAuth: [] } ]
      responses:
        "200":
          description: Stats payload
          content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }

  /admin/users/{userId}/password:
    put:
      tags: [Admin]
      summary: Reset a user's password (admin)
      security: [ { BearerAuth: [] } ]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer, example: 1024 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, example: "AdminReset123!" }
      responses:
        "200":
          description: Password reset
          content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

externalDocs:
  description: Matches the “Credentials API – Group 2 (Heroku)” Postman tests
  url: https://credentials-api-group2-20f368b8528b.herokuapp.com/api-docs/
