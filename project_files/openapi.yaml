openapi: 3.0.3
info:
  title: Movies API - Group 2 
  version: 1.0.0
  description: |
    Comprehensive Movie API with read and write routes, advanced filtering, and API-key auth.
    Notes:
    - All routes require API key authentication except **GET /api/hello**.
    - Some list endpoints may return 200 with an empty array for “no results” (e.g., invalid MPA rating).

servers:
  - url: https://movie-api-group2-20e70498bde4.herokuapp.com
    description: Production (Heroku)
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for authentication

  schemas:
    Pagination:
      type: object
      properties:
        limit: { type: integer, example: 10 }
        offset: { type: integer, example: 0 }
        page: { type: integer, example: 1 }
        total: { type: integer, example: 9329 }

    Movie:
      type: object
      properties:
        movie_id: { type: integer, example: 13046 }
        title: { type: string, example: "The Dark Knight" }
        release_year: { type: integer, example: 2008 }
        runtime_minutes: { type: integer, example: 152 }
        rating: { type: string, example: "7.5" }           # API returns string
        box_office: { type: string, example: "1004558444.00" } # API returns string
        director_id: { type: integer, example: 1 }
        country_id: { type: integer, example: 1 }
        # Fields your POST test checks for:
        overview: { type: string, example: "A brief synopsis..." }
        genres: { type: string, example: "Action, Crime" }
        director_name: { type: string, example: "Christopher Nolan" }
        budget: { type: string, example: "185000000.00" }
        studios: { type: string, example: "Warner Bros." }
        poster_url: { type: string, example: "https://example.com/poster.jpg" }
        backdrop_url: { type: string, example: "https://example.com/backdrop.jpg" }
        collection: { type: string, example: "The Dark Knight Collection" }
        original_title: { type: string, example: "The Dark Knight" }
        actors:
          type: string
          example: "Christian Bale, Heath Ledger"
        mpa_rating:
          type: string
          example: "PG-13"
      required:
        - movie_id
        - title
        - release_year
        - runtime_minutes
        - rating
        - box_office
        - director_id
        - country_id

    MovieCreate:
      type: object
      properties:
        title: { type: string, example: "Postman Test Movie" }
        release_year: { type: integer, example: 2024 }
        runtime_minutes: { type: integer, example: 120 }
        rating: { type: number, example: 7.5 } # incoming may be number
        box_office: { type: string, example: "1000000" }
        director_id: { type: integer, example: 1 }
        country_id: { type: integer, example: 1 }
        genres: { type: string, example: "Drama" }
        mpa_rating: { type: string, example: "PG-13" }
      required: [title, release_year, runtime_minutes, rating, box_office, director_id, country_id]

    MovieUpdate:
      type: object
      properties:
        title: { type: string, example: "Postman Test Movie (updated)" }
        release_year: { type: integer }
        runtime_minutes: { type: integer }
        rating: { type: number }
        box_office: { type: string }
        director_id: { type: integer }
        country_id: { type: integer }
        genres: { type: string }
        mpa_rating: { type: string }

    Director:
      type: object
      properties:
        id: { type: integer, example: 4384 }
        name: { type: string, example: "Christopher Nolan" }

    SuccessEnvelopeList:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Success" }
        data:
          type: array
          items: {}
        pagination:
          $ref: "#/components/schemas/Pagination"

    SuccessEnvelopeObject:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "created" }
        data:
          type: object

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string, example: "Invalid API key" }
        details: { type: string, example: "The provided API key is not valid" }

  responses:
    UnauthorizedError:
      description: Unauthorized - API key required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Forbidden - Invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

security:
  - ApiKeyAuth: []

paths:
  /api/hello:
    get:
      tags: [System]
      summary: Sanity / health check
      security: []   # no API key required
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello from Group 2 👋

  /api/v1/movies:
    get:
      tags: [Movies]
      summary: List movies with filters & pagination
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
          description: Number of movies to return
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Number of movies to skip
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Alternative to offset
        - in: query
          name: mpaRating
          schema: { type: string, example: "PG-13" }
        - in: query
          name: yearMin
          schema: { type: integer, example: 2019 }
        - in: query
          name: yearMax
          schema: { type: integer, example: 2023 }
        - in: query
          name: genre
          schema: { type: string, example: "Action" }
        - in: query
          name: director
          schema: { type: string, example: "Christopher Nolan" }
        - in: query
          name: actor
          schema: { type: string, example: "Tom Hanks" }
      responses:
        "200":
          description: Movies list (may be empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelopeList"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Movie"
        "400": { $ref: '#/components/responses/BadRequestError' }
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

    post:
      tags: [Movies]
      summary: Create a movie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovieCreate" }
      responses:
        "200":
          description: Created (API returns 200 with success message)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelopeObject"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Movie"
        "400": { $ref: '#/components/responses/BadRequestError' }
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/movies/{id}:
    put:
      tags: [Movies]
      summary: Update a movie by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovieUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeObject"
        "400": { $ref: '#/components/responses/BadRequestError' }
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }
        "404": { $ref: '#/components/responses/NotFoundError' }

    delete:
      tags: [Movies]
      summary: Delete a movie by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeObject"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }
        "404": { $ref: '#/components/responses/NotFoundError' }

  /api/v1/movies/top-grossing:
    get:
      tags: [Movies]
      summary: Highest grossing movies
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Sorted by box office
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeList"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/movies/recent:
    get:
      tags: [Movies]
      summary: Recently released movies
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: years
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: Recent movies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeList"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/movies/mpa/{rating}:
    get:
      tags: [Movies]
      summary: Get movies by MPA rating
      parameters:
        - in: path
          name: rating
          required: true
          schema: { type: string, example: "PG-13" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK (may be empty array for unknown ratings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeList"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/moviebyyear:
    get:
      tags: [Movies]
      summary: List movies released in a given year
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer, example: 2023 }
          description: 4-digit release year
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Movies for the given year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeList"
        "400":
          description: Bad Request - invalid year parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/movies/director/{id}:
    get:
      tags: [Movies]
      summary: Get movies by director ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 2 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Movies by the specified director
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeList"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }
        "404": { $ref: '#/components/responses/NotFoundError' }

  /api/v1/movies/actor/{id}:
    get:
      tags: [Movies]
      summary: Get movies by actor ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 5 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Movies featuring the specified actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeList"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }
        "404": { $ref: '#/components/responses/NotFoundError' }

  /api/v1/directors:
    get:
      tags: [Directors]
      summary: Get all directors
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: List of directors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelopeList"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Director"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

    post:
      tags: [Directors]
      summary: Create a director
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Christopher Nolan {{randomInt}}" }
              required: [name]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelopeObject"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Director"
        "400": { $ref: '#/components/responses/BadRequestError' }
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/directors/{id}:
    put:
      tags: [Directors]
      summary: Update a director
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 4384 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Updated Director 1730510400" }
              required: [name]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeObject"
        "400": { $ref: '#/components/responses/BadRequestError' }
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }
        "404": { $ref: '#/components/responses/NotFoundError' }

    delete:
      tags: [Directors]
      summary: Delete a director
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 4384 }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelopeObject"
        "401": { $ref: '#/components/responses/UnauthorizedError' }
        "403": { $ref: '#/components/responses/ForbiddenError' }
        "404": { $ref: '#/components/responses/NotFoundError' }

externalDocs:
  description: Live API (Heroku)
  url: https://movie-api-group2-20e70498bde4.herokuapp.com
